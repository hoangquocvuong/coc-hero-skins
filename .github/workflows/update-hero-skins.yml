name: Auto Hero Skins Build

on:
  # Chạy thủ công
  workflow_dispatch:

  # Chủ nhật hàng tuần (00:00 UTC)
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build Hero Skins JSON
        run: |
          node update-hero-skins.js

      - name: Validate JSON Files
        run: |
          node - <<'EOF'
          const fs = require("fs");

          const files = [
            "barbarian-king.json",
            "archer-queen.json",
            "grand-warden.json",
            "royal-champion.json",
            "minion-prince.json",
            "dragon-duke.json"
          ];

          let total = 0;

          for (const file of files) {

            if (!fs.existsSync(file)) {
              console.error("Missing:", file);
              process.exit(1);
            }

            const data = JSON.parse(
              fs.readFileSync(file, "utf8")
            );

            if (!Array.isArray(data.skins)) {
              console.error(file + " -> skins is not array");
              process.exit(1);
            }

            if (data.skins.length === 0) {
              console.error(file + " -> ZERO skins");
              process.exit(1);
            }

            if (data.count !== data.skins.length) {
              console.error(
                file +
                " -> count mismatch (" +
                data.count +
                " != " +
                data.skins.length +
                ")"
              );
              process.exit(1);
            }

            total += data.count;

            console.log(
              "✔",
              data.hero,
              data.count
            );
          }

          console.log("");
          console.log("TOTAL:", total);
          console.log("Validation OK");
          EOF

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            hero-skins.json \
            barbarian-king.json \
            archer-queen.json \
            grand-warden.json \
            royal-champion.json \
            minion-prince.json \
            dragon-duke.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "auto: update hero skins"

      - name: Push Changes
        run: |
          git push origin main
