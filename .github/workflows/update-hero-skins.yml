name: Auto Hero Skins Crawler

on:
  schedule:
    - cron: "0 0 * * 0"  # Chủ nhật hàng tuần
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # 🔥 FIX Node 24 deprecation warning
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ❌ KHÔNG npm install (vì bạn không có package.json)

      - name: Run crawler
        run: node update-hero-skins.js

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "auto: update hero skins"

      - name: Push changes
        run: git push origin main
